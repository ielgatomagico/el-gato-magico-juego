<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Gato Mágico · Casa de Brujas</title>
<style>
:root{--noche:#120a1f;--ciruela:#2a1745;--luna:#f9f7f8;--oro:#e8c46a;--lila:#a77bd1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--luna);font-family:Georgia,"Times New Roman",serif;
 background:radial-gradient(ellipse at 50% 0,var(--ciruela),var(--noche) 65%);
 display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 12px 30px}
.logo{width:min(380px,82vw);height:auto;display:block}
.btn{padding:13px 34px;border:2px solid var(--oro);border-radius:999px;color:var(--oro);text-decoration:none;
 font-size:18px;letter-spacing:.04em;transition:background .2s,color .2s,box-shadow .2s}
.btn:hover,.btn:focus-visible{background:var(--oro);color:var(--noche);box-shadow:0 0 22px rgba(232,196,106,.6);outline:none}
#hud{display:flex;gap:22px;font-size:20px;min-height:28px}
canvas{width:min(768px,96vw);height:auto;aspect-ratio:16/11;border:4px solid #46306a;border-radius:6px;background:#000;touch-action:none}
.ayuda{margin:0;font-size:15px;opacity:.8;text-align:center}
.pad{display:none;gap:10px;align-items:center}
.pad button{width:58px;height:58px;font-size:24px;border-radius:50%;border:2px solid var(--lila);background:#2a1745;color:var(--luna)}
.pad .col{display:flex;flex-direction:column;gap:10px}
.pad .fila{display:flex;gap:10px}
.pad .magia{width:78px;height:78px;border-color:var(--oro);margin-left:24px}
@media (pointer:coarse){.pad{display:flex}}
</style>
</head>

<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const T=48,W=16,H=11;
const map=[
"#######DD#######",
"#T............T#",
"#..............#",
"#...##....##...#",
"#..............#",
"#......##......#",
"#..............#",
"#...##....##...#",
"#..............#",
"#T............T#",
"################"];
const keys={};
let p,en,bolts,esc,llave,puerta,hp,tieneLlave,estado,inv,cool,fr=0;

addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 if(k==='enter'&&estado!=='juego')reset();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;});
 ['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>{keys[k]=false;}));});
cv.addEventListener('pointerdown',()=>{if(estado!=='juego')reset();});

function reset(){
 p={x:8*T,y:9.5*T,fx:0,fy:-1};
 en=[[3,2],[12,2],[5,5],[10,5],[4,8],[11,8]].map(([c,r])=>({x:(c+.5)*T,y:(r+.5)*T,dx:1,dy:0,hp:3,t:0,s:80+Math.random()*100}));
 bolts=[];esc=[];llave=null;puerta=false;hp=3;tieneLlave=false;estado='juego';inv=0;cool=0;
 hud();
}
function hud(){
 document.getElementById('vida').textContent='❤'.repeat(hp)+'♡'.repeat(3-hp);
 document.getElementById('llave').textContent=tieneLlave?'🗝️ Llave':'';
 document.getElementById('msg').textContent=!tieneLlave?'Silencia a los 6 charlatanes para que aparezca la llave.':(puerta?'¡Cruza la puerta!':'Lleva la llave a la puerta de arriba.');
}
function solido(x,y){const c=(map[Math.floor(y/T)]||'')[Math.floor(x/T)];
 return c===undefined||c==='#'||c==='T'||(c==='D'&&!puerta);}
function libre(x,y,r){return !(solido(x-r,y-r)||solido(x+r,y-r)||solido(x-r,y+r)||solido(x+r,y+r));}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function update(){
 const dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);
 const dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
 if(dx||dy){p.fx=dx;p.fy=dy;}
 const s=2.4*(dx&&dy?.707:1);
 if(libre(p.x+dx*s,p.y,12))p.x+=dx*s;
 if(libre(p.x,p.y+dy*s,12))p.y+=dy*s;
 if(keys[' ']&&cool<=0){const m=Math.hypot(p.fx,p.fy);bolts.push({x:p.x,y:p.y,vx:p.fx/m*7,vy:p.fy/m*7});cool=22;}
 cool--;inv--;

 bolts=bolts.filter(b=>{
  b.x+=b.vx;b.y+=b.vy;
  if(solido(b.x,b.y))return false;
  for(const e of en){if(dist(b,e)<20){e.hp--;e.x+=b.vx*3;e.y+=b.vy*3;
   if(!libre(e.x,e.y,13)){e.x-=b.vx*3;e.y-=b.vy*3;}return false;}}
  return true;});
 const antes=en.length;en=en.filter(e=>e.hp>0);
 if(!en.length&&antes&&!llave&&!tieneLlave){llave={x:7.5*T,y:4.5*T};hud();}

 for(const e of en){
  if(--e.t<=0){const a=Math.random()<.7?Math.atan2(p.y-e.y,p.x-e.x):Math.floor(Math.random()*4)*Math.PI/2;
   e.dx=Math.cos(a);e.dy=Math.sin(a);e.t=40+Math.random()*40;}
  if(libre(e.x+e.dx*1.5,e.y,13))e.x+=e.dx*1.5;else e.t=0;
  if(libre(e.x,e.y+e.dy*1.5,13))e.y+=e.dy*1.5;else e.t=0;
  if(--e.s<=0){const d=dist(p,e);if(d<360){const a=Math.atan2(p.y-e.y,p.x-e.x);esc.push({x:e.x,y:e.y,vx:Math.cos(a)*2.9,vy:Math.sin(a)*2.9});}e.s=100+Math.random()*80;}
  if(dist(p,e)<24&&inv<=0){hp--;inv=75;hud();if(hp<=0)estado='perdiste';}
 }
 esc=esc.filter(q=>{q.x+=q.vx;q.y+=q.vy;
  if(solido(q.x,q.y))return false;
  for(let i=0;i<bolts.length;i++){if(dist(q,bolts[i])<14){bolts.splice(i,1);return false;}}
  if(dist(q,p)<17&&inv<=0){hp--;inv=75;hud();if(hp<=0)estado='perdiste';return false;}
  return true;});
 if(llave&&dist(p,llave)<24){llave=null;tieneLlave=true;hud();}
 if(tieneLlave&&!puerta&&p.y<1.7*T&&Math.abs(p.x-8*T)<T){puerta=true;hud();}
 if(puerta&&p.y<.75*T)estado='ganaste';
}

function dibujaTile(c,r){
 const x=c*T,y=r*T,t=map[r][c];
 g.fillStyle=(r+c)%2?'#2b1d3f':'#32224a';g.fillRect(x,y,T,T);
 if(t==='#'||t==='T'||t==='D'){
  g.fillStyle='#5a4a6e';g.fillRect(x,y,T,T);
  g.strokeStyle='#38294d';g.lineWidth=2;g.strokeRect(x+1,y+1,T-2,T/2-1);g.strokeRect(x+1,y+T/2,T-2,T/2-1);
 }
 if(t==='T'){const f=5+Math.sin(fr)*1.5;
  g.fillStyle='rgba(255,170,60,.25)';g.beginPath();g.arc(x+T/2,y+T/2,18+f,0,7);g.fill();
  g.fillStyle='#ffb347';g.beginPath();g.arc(x+T/2,y+T/2,f+3,0,7);g.fill();
  g.fillStyle='#fff3b0';g.beginPath();g.arc(x+T/2,y+T/2+1,f-1,0,7);g.fill();}
 if(t==='D'){
  g.fillStyle=puerta?'#fff3c4':'#6b3e1f';g.fillRect(x,y,T,T);
  if(!puerta){g.fillStyle='#e8c46a';g.fillRect(x+T/2-1,y,2,T);
   if(c===7){g.beginPath();g.arc(x+T-4,y+T/2,6,0,7);g.fill();}}
 }
}
function bruja(){
 g.save();g.translate(p.x,p.y);
 if(inv>0&&Math.floor(inv/5)%2)g.globalAlpha=.4;
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,15,13,5,0,0,7);g.fill();
 const m=Math.hypot(p.fx,p.fy);
 g.strokeStyle='#c9a36b';g.lineWidth=3;g.beginPath();g.moveTo(0,4);g.lineTo(p.fx/m*18,4+p.fy/m*18);g.stroke();
 g.fillStyle='#ffe27a';g.beginPath();g.arc(p.fx/m*19,4+p.fy/m*19,4,0,7);g.fill();
 g.fillStyle='#6a2c91';g.beginPath();g.moveTo(-12,15);g.lineTo(-7,-3);g.lineTo(7,-3);g.lineTo(12,15);g.closePath();g.fill();
 g.fillStyle='#f1c9a5';g.beginPath();g.arc(0,-8,8,0,7);g.fill();
 g.fillStyle='#222';g.fillRect(-4+p.fx*2,-8+p.fy*2,2,3);g.fillRect(2+p.fx*2,-8+p.fy*2,2,3);
 g.fillStyle='#1c1230';g.beginPath();g.ellipse(0,-14,15,4,0,0,7);g.fill();
 g.beginPath();g.moveTo(-8,-14);g.lineTo(8,-14);g.lineTo(4,-30);g.lineTo(11,-34);g.lineTo(0,-33);g.closePath();g.fill();
 g.fillStyle='#e8c46a';g.fillRect(-8,-18,16,3);
 g.restore();
}
function charlaton(e){
 const q=Math.sin(fr*1.5+e.x),b=Math.abs(q)*7;
 g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(e.x,e.y+14,14,4,0,0,7);g.fill();
 g.fillStyle=['','#e9a6c4','#c2588a','#8e2f66'][e.hp];
 g.beginPath();g.ellipse(e.x,e.y,15,15,0,0,7);g.fill();
 g.fillStyle='#fff';g.fillRect(e.x-8,e.y-10,6,6);g.fillRect(e.x+2,e.y-10,6,6);
 g.fillStyle='#111';g.fillRect(e.x-6,e.y-8,3,3);g.fillRect(e.x+3,e.y-8,3,3);
 g.fillStyle='#3a0a24';g.beginPath();g.ellipse(e.x,e.y+5,9,2+b/2,0,0,7);g.fill();
 g.fillStyle='#fff';g.fillRect(e.x-6,e.y+3-b/4,3,3);g.fillRect(e.x+3,e.y+3-b/4,3,3);
 g.fillStyle='#8e2f66';g.fillRect(e.x-10,e.y+13,5,4);g.fillRect(e.x+5,e.y+13,5,4);
}
function dibuja(){
 for(let r=0;r<H;r++)for(let c=0;c<W;c++)dibujaTile(c,r);
 if(llave){const b=Math.sin(fr)*3;
  g.fillStyle='rgba(255,226,122,.3)';g.beginPath();g.arc(llave.x,llave.y+b,20,0,7);g.fill();
  g.strokeStyle='#e8c46a';g.lineWidth=4;g.beginPath();g.arc(llave.x-6,llave.y+b,6,0,7);g.moveTo(llave.x,llave.y+b);g.lineTo(llave.x+12,llave.y+b);
  g.moveTo(llave.x+8,llave.y+b);g.lineTo(llave.x+8,llave.y+b+6);g.stroke();}
 en.forEach(charlaton);
 g.font='bold 12px Georgia,serif';g.textAlign='center';esc.forEach(q=>{g.fillStyle='#ffd1e6';g.beginPath();g.ellipse(q.x,q.y,15,9,0,0,7);g.fill();g.fillStyle='#8e2f66';g.fillText('bla',q.x,q.y+4);});
